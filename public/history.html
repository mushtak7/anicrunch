<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5700333343796793"
         crossorigin="anonymous"></script>
    <meta name="google-adsense-account" content="ca-pub-5700333343796793">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AniCrunch – Watch History</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
  <script src="/layout.js"></script>
</head>
<body>

<header>
  <h1 class="logo" onclick="location.href='/'">anicrunch</h1>
  <div class="search-container" style="display:none;"></div>
  <div id="authArea"></div>
</header>

<section class="watchlist-hero" style="min-height: auto; padding: 40px 20px; background: linear-gradient(135deg, rgba(142, 142, 168, 0.08) 0%, rgba(120, 75, 160, 0.08) 100%);">
  <div class="watchlist-hero-content" style="text-align: center;">
    <h1>🕒 Watch History</h1>
    <p>Check the anime titles you have recently discovered on AniCrunch.</p>
  </div>
</section>

<main class="page-container">
  <div style="display: flex; justify-content: flex-end; margin-bottom: 20px;">
    <button class="btn-action" style="padding: 10px 20px;" onclick="clearHistory()">🗑️ Clear History</button>
  </div>

  <div id="historyGrid" class="responsive-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 20px;">
    <div style="grid-column: 1/-1; text-align: center; color: var(--muted); padding: 40px 0;">
      Your history is empty. Start exploring anime to fill it up!
    </div>
  </div>
</main>

<script>
function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

  document.addEventListener("DOMContentLoaded", () => {
    // Auth Check
    fetch(`${API_BASE}/api/me`, { credentials: "include" })
      .then(r => r.json())
      .then(d => {
        const authArea = document.getElementById("authArea");
        if (d.user && authArea) {
          authArea.innerHTML = `<span style="color:var(--muted)">👤 ${escapeHtml(d.user.username)}</span>`;
        }
      }).catch(() => {});

    loadHistory();
  });

  function loadHistory() {
    const grid = document.getElementById("historyGrid");
    const raw = localStorage.getItem("anicrunch_history");
    if (!raw) return;

    try {
      const list = JSON.parse(raw);
      if (!list.length) return;

      grid.innerHTML = "";
      list.forEach(anime => {
        const card = document.createElement("div");
        card.className = "anime-card";
        
        const title = anime.title;
        const score = anime.score || "N/A";
        const type = anime.type || "TV";
        const imgUrl = anime.imgUrl;
        const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
        const animeUrl = `/anime/${anime.malId}-${slug || 'details'}`;

        card.innerHTML = `
          <div class="anime-card-poster">
            <img src="${imgUrl}" alt="${escapeHtml(title)}" loading="lazy">
            <div class="anime-card-rating">⭐ ${score}</div>
          </div>
          <div class="anime-card-content">
            <h3 style="font-size:14px; line-height:1.4; height:38px; display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical; overflow:hidden;">${escapeHtml(title)}</h3>
            <div class="anime-card-meta">
              <span>${type}</span>
            </div>
          </div>
        `;
        card.onclick = () => location.href = animeUrl;
        grid.appendChild(card);
      });
    } catch(e) { console.warn("Failed to parse history data", e); }
  }

  function clearHistory() {
    if (confirm("Clear your viewing history?")) {
      localStorage.removeItem("anicrunch_history");
      document.getElementById("historyGrid").innerHTML = `
        <div style="grid-column: 1/-1; text-align: center; color: var(--muted); padding: 40px 0;">
          Your history is empty. Start exploring anime to fill it up!
        </div>
      `;
    }
  }
</script>
</body>
</html>
