    </div>

  <div id="catalogLoadMoreContainer" style="display: flex; justify-content: center; margin-top: 40px; margin-bottom: 60px;">
    <!-- Dynamic load more button will render here -->
  </div>
</main>

<script>
function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

  let currentPage = 1;
  let hasMore = true;
  let isLoading = false;

  document.addEventListener("DOMContentLoaded", () => {
    // Auth Check
    fetch(`${API_BASE}/api/me`, { credentials: "include" })
      .then(r => r.json())
      .then(d => {
        const authArea = document.getElementById("authArea");
        if (d.user && authArea) {
          authArea.innerHTML = `<span style="color:var(--muted)">👤 ${escapeHtml(d.user.username)}</span>`;
        }
      }).catch(() => {});

    // Initial load
    applyCatalogFilters();
  });

  function applyCatalogFilters() {
    currentPage = 1;
    hasMore = true;
    document.getElementById("catalogGrid").innerHTML = `
      <div style="grid-column: 1/-1; padding: 40px 0; text-align: center; color: var(--muted);">
        ⏳ Loading filter results...
      </div>
    `;
    document.getElementById("catalogLoadMoreContainer").innerHTML = "";
    loadCatalogPage();
  }

  async function loadCatalogPage() {
    if (isLoading || !hasMore) return;
    isLoading = true;

    const grid = document.getElementById("catalogGrid");
    const q = document.getElementById("catalogSearch").value.trim();
    const genre = document.getElementById("genreSelect").value;
    const tag = document.getElementById("tagSelect").value;
    const format = document.getElementById("formatSelect").value;
    const status = document.getElementById("statusSelect").value;
    const sort = document.getElementById("sortSelect").value;

    let url = `https://api.jikan.moe/v4/anime?page=${currentPage}&limit=18&sfw=true`;
    if (q) url += `&q=${encodeURIComponent(q)}`;
    
    let genresParam = [];
    if (genre) genresParam.push(genre);
    if (tag) genresParam.push(tag);
    if (genresParam.length > 0) {
      url += `&genres=${genresParam.join(',')}`;
    }
    if (format) url += `&type=${format}`;
    if (status) url += `&status=${status}`;
    if (sort) {
      url += `&order_by=${sort}`;
      url += (sort === 'title') ? `&sort=asc` : `&sort=desc`;
    } else {
      url += `&order_by=popularity&sort=desc`;
    }

    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error("Catalog fetch failed");
      const json = await res.json();
      const data = json.data || [];
      const pagination = json.pagination || { has_next_page: false };

      if (currentPage === 1) {
        grid.innerHTML = "";
      }

      // Remove load indicators
      const loader = grid.querySelector('.catalog-loader');
      if (loader) loader.remove();

      if (data.length === 0 && currentPage === 1) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--muted); padding: 40px 0;">No matching catalog entries found. Try broadening your criteria.</div>`;
        hasMore = false;
        isLoading = false;
        return;
      }

      data.forEach(anime => {
        const card = document.createElement("div");
        card.className = "anime-card";
        
        const title = anime.title_english || anime.title;
        const score = anime.score || "N/A";
        const year = anime.year || "N/A";
        const type = anime.type || "TV";
        const imgUrl = anime.images?.jpg?.large_image_url || anime.images?.jpg?.image_url;

        const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
        const animeUrl = `/anime/${anime.mal_id}-${slug || 'details'}`;

        card.innerHTML = `
          <div class="anime-card-poster">
            <img src="${imgUrl}" alt="${escapeHtml(title)}" loading="lazy">
            <div class="anime-card-rating">⭐ ${score}</div>
          </div>
          <div class="anime-card-content">
            <h3 style="font-size:14px; line-height:1.4; height:38px; display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical; overflow:hidden;">${escapeHtml(title)}</h3>
            <div class="anime-card-meta">
              <span>${year}</span>
              <span>•</span>
              <span>${type}</span>
            </div>
          </div>
        `;
        card.onclick = () => location.href = animeUrl;
        grid.appendChild(card);
      });

      hasMore = pagination.has_next_page;
      currentPage++;
      isLoading = false;

      // Render load more button if pagination has next page
      if (hasMore) {
        renderLoadMoreButton();
      } else {
        document.getElementById("catalogLoadMoreContainer").innerHTML = "";
      }

    } catch (e) {
      console.error(e);
      isLoading = false;
      if (currentPage === 1) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--error); padding: 40px 0;">⚠️ Failed to load catalog data.</div>`;
      }
    }
  }

  function renderLoadMoreButton() {
    const container = document.getElementById("catalogLoadMoreContainer");
    container.innerHTML = "";

    const btn = document.createElement("button");
    btn.className = "btn-action";
    btn.style.padding = "12px 30px";
    btn.textContent = "Load More Anime";
    btn.onclick = () => {
      btn.textContent = "Loading...";
      btn.disabled = true;
      loadCatalogPage();
    };
    container.appendChild(btn);
  }
</script>
