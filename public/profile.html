<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <title>anicrunch · My Profile</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/layout.js"></script>
  <style>
    .profile-page { min-height: 100vh; background: #0f0f1a; }

    /* Hero Header */
    .profile-hero {
      position: relative;
      padding: 60px 40px;
      background: linear-gradient(135deg, rgba(120, 75, 160, 0.1) 0%, rgba(255, 60, 172, 0.1) 100%);
      border-bottom: 1px solid var(--border);
    }

    .profile-hero-content {
      position: relative;
      z-index: 1;
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .avatar-container {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--accent);
      background: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    .avatar-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-info {
      flex: 1;
    }

    .profile-info h1 {
      font-size: 36px;
      margin: 0 0 10px 0;
      color: white;
    }

    .profile-bio {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 15px;
      max-width: 500px;
    }

    .stats-bar {
      display: flex;
      gap: 20px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stat-icon { font-size: 20px; }
    .stat-info h3 { font-size: 20px; margin: 0; font-weight: 700; color: white;}
    .stat-info p { font-size: 12px; color: var(--muted); margin: 0; }

    /* Settings Form */
    .profile-settings {
      max-width: 800px;
      margin: 40px auto;
      padding: 30px;
      background: #1a1a2e;
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .profile-settings h2 {
      margin-top: 0;
      color: white;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      color: var(--muted);
      margin-bottom: 8px;
      font-size: 14px;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: white;
      font-family: inherit;
    }
    
    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .btn-save {
      background: var(--gradient);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    
    .btn-save:hover { opacity: 0.9; }

    .loader {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 40px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

  </style>
</head>
<body class="profile-page">

<header>
  <h1 onclick="location.href='/'" style="cursor:pointer; margin: 0; font-size: 24px; font-weight: bold; color: white;">anicrunch</h1>
  <div style="flex:1"></div>
  <a href="/watchlist.html" class="nav-link" style="color: var(--muted); margin-right: 20px; text-decoration: none;">Watchlist</a>
  <a href="/quiz.html" class="nav-link" style="color: var(--muted); margin-right: 20px; text-decoration: none;">🏆 Trivia Arena</a>
  <div id="authArea"></div>
</header>

<div id="loadingState">
  <div class="loader"></div>
</div>

<div id="profileContent" style="display: none;">
  <section class="profile-hero">
    <div class="profile-hero-content">
      <div class="avatar-container" id="avatarDisplay">
        👤
      </div>
      <div class="profile-info">
        <h1 id="usernameDisplay">Username</h1>
        <p class="profile-bio" id="bioDisplay">No bio set.</p>
        <div class="stats-bar" style="margin-top: 25px; flex-wrap: wrap;">
          <div class="stat-card">
            <div class="stat-icon">✅</div>
            <div class="stat-info"><h3 id="statTotalWatched">0</h3><p>Completed</p></div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">⏱️</div>
            <div class="stat-info"><h3 id="statHoursWatched">0</h3><p>Hours Watched</p></div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">⭐</div>
            <div class="stat-info"><h3 id="statMeanScore">0.0</h3><p>Mean Score</p></div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">🏷️</div>
            <div class="stat-info"><h3 id="statFavGenre" style="font-size: 16px; font-weight: 700; color: white;">N/A</h3><p>Fav Genre</p></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="profile-settings" style="margin-top: 30px;">
    <h2>📊 Watchlist Distribution</h2>
    <div style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
      <!-- Watching -->
      <div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 14px; font-weight: 600;">
          <span style="color: #3b82f6;">📺 Watching</span>
          <span id="distWatchingVal">0 shows</span>
        </div>
        <div style="width: 100%; height: 10px; background: rgba(255,255,255,0.05); border-radius: 99px; overflow: hidden; border: 1px solid var(--border);">
          <div id="distWatchingBar" style="width: 0%; height: 100%; background: linear-gradient(135deg, #3b82f6, #1d4ed8); transition: width 0.8s ease-out; border-radius: 99px;"></div>
        </div>
      </div>
      <!-- Completed -->
      <div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 14px; font-weight: 600;">
          <span style="color: #10b981;">✅ Completed</span>
          <span id="distCompletedVal">0 shows</span>
        </div>
        <div style="width: 100%; height: 10px; background: rgba(255,255,255,0.05); border-radius: 99px; overflow: hidden; border: 1px solid var(--border);">
          <div id="distCompletedBar" style="width: 0%; height: 100%; background: linear-gradient(135deg, #10b981, #047857); transition: width 0.8s ease-out; border-radius: 99px;"></div>
        </div>
      </div>
      <!-- Plan to Watch -->
      <div>
        <div style="display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 14px; font-weight: 600;">
          <span style="color: #f59e0b;">📅 Plan to Watch</span>
          <span id="distPlanVal">0 shows</span>
        </div>
        <div style="width: 100%; height: 10px; background: rgba(255,255,255,0.05); border-radius: 99px; overflow: hidden; border: 1px solid var(--border);">
          <div id="distPlanBar" style="width: 0%; height: 100%; background: linear-gradient(135deg, #f59e0b, #b45309); transition: width 0.8s ease-out; border-radius: 99px;"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="profile-settings">
    <h2>Edit Profile</h2>
    <form id="profileForm">
      <div class="form-group">
        <label for="avatarUrl">Avatar Image URL (Optional)</label>
        <input type="url" id="avatarUrl" placeholder="https://example.com/avatar.jpg">
      </div>
      <div class="form-group">
        <label for="bio">Bio (Optional)</label>
        <textarea id="bio" placeholder="Tell us about your favorite anime..."></textarea>
      </div>
      <div class="form-group">
        <label for="siteTheme">Website Theme</label>
        <select id="siteTheme" style="width: 100%; padding: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); border-radius: 8px; color: white; font-family: inherit;">
          <option value="default" style="background:#1a1a2e; color:white;">Classic Midnight (Default)</option>
          <option value="sakura" style="background:#1a1a2e; color:white;">🌸 Sakura Pink</option>
          <option value="cyberpunk" style="background:#1a1a2e; color:white;">⚡ Neon Cyberpunk</option>
          <option value="oled" style="background:#1a1a2e; color:white;">🖤 OLED Pure Black</option>
        </select>
      </div>
      <button type="submit" class="btn-save" id="saveBtn">Save Changes</button>
      <span id="saveStatus" style="margin-left: 15px; color: #00e676; display: none;">Saved!</span>
    </form>
  </section>
</div>

<script>
function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

document.addEventListener("DOMContentLoaded", () => {
  const authArea = document.getElementById("authArea");

  fetch(`${API_BASE}/api/me`, { credentials: "include" })
    .then(r => r.json())
    .then(d => {
      if (d.user) {
        authArea.innerHTML = `<span style="color:var(--muted)">👤 ${escapeHtml(d.user.username)}</span> <button class="auth-link" style="background: none; border: none; color: var(--accent); cursor: pointer; margin-left: 10px;" onclick="logout()">Logout</button>`;
        loadProfile();
      } else {
        location.href = '/login.html';
      }
    })
    .catch(() => location.href = '/login.html');

  const siteThemeSelect = document.getElementById('siteTheme');
  const currentTheme = localStorage.getItem("anicrunch_theme") || "default";
  if (siteThemeSelect) {
    siteThemeSelect.value = currentTheme;
  }

  window.logout = () => fetch(`${API_BASE}/api/logout`, { 
    method: "POST", 
    credentials: "include" 
  }).then(() => location.href = '/');
  
  document.getElementById('profileForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('saveBtn');
    btn.innerText = 'Saving...';
    btn.disabled = true;
    
    const avatarUrl = document.getElementById('avatarUrl').value.trim();
    const bio = document.getElementById('bio').value;
    const theme = document.getElementById('siteTheme').value;
    
    if (avatarUrl && !/^https?:\/\//i.test(avatarUrl)) {
      alert("Invalid avatar URL. Only http:// and https:// protocols are allowed.");
      btn.innerText = 'Save Changes';
      btn.disabled = false;
      return;
    }
    
    try {
      const res = await fetch(`${API_BASE}/api/profile/update`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ avatarUrl, bio })
      });
      
      if (res.ok) {
        // Save and apply theme instantly
        localStorage.setItem("anicrunch_theme", theme);
        document.body.classList.remove('theme-sakura', 'theme-cyberpunk', 'theme-oled');
        document.documentElement.classList.remove('theme-sakura', 'theme-cyberpunk', 'theme-oled');
        if (theme !== 'default') {
          document.body.classList.add(`theme-${theme}`);
          document.documentElement.classList.add(`theme-${theme}`);
        }

        document.getElementById('saveStatus').style.display = 'inline';
        setTimeout(() => document.getElementById('saveStatus').style.display = 'none', 3000);
        
        // Update display
        const avatarDisplay = document.getElementById('avatarDisplay');
        if (avatarUrl && /^https?:\/\//i.test(avatarUrl)) {
          const img = document.createElement('img');
          img.src = avatarUrl;
          img.alt = 'Avatar';
          avatarDisplay.replaceChildren(img);
        } else {
          avatarDisplay.textContent = '👤';
        }
        document.getElementById('bioDisplay').innerText = bio || 'No bio set.';
      }
    } catch (e) {
      console.error(e);
      alert('Error saving profile');
    } finally {
      btn.innerText = 'Save Changes';
      btn.disabled = false;
    }
  });
});

async function loadProfile() {
  try {
    const res = await fetch(`${API_BASE}/api/profile`, { credentials: "include" });
    if (!res.ok) throw new Error('Failed to load profile');
    
    const data = await res.json();
    
    document.getElementById('usernameDisplay').innerText = data.user.username;
    document.getElementById('bioDisplay').innerText = data.user.bio || 'No bio set.';
    
    const avatarDisplay = document.getElementById('avatarDisplay');
    if (data.user.avatar_url && /^https?:\/\//i.test(data.user.avatar_url)) {
      const img = document.createElement('img');
      img.src = data.user.avatar_url;
      img.alt = 'Avatar';
      avatarDisplay.replaceChildren(img);
      document.getElementById('avatarUrl').value = data.user.avatar_url;
    } else {
      avatarDisplay.textContent = '👤';
    }
    
    if (data.user.bio) {
      document.getElementById('bio').value = data.user.bio;
    }
    
    // Calculate Stats
    const watchlist = data.watchlist || [];
    let completedCount = 0;
    let watchingCount = 0;
    let planCount = 0;
    let totalEpisodes = 0;
    let totalScoresSum = 0;
    let scoredItemsCount = 0;
    
    const genreCounts = {};
    let favGenre = 'N/A';
    let maxGenreCount = 0;
    
    watchlist.forEach(item => {
      totalEpisodes += (item.progress || 0);
      
      if (item.status === 'completed') completedCount++;
      else if (item.status === 'watching') watchingCount++;
      else if (item.status === 'plan') planCount++;
      
      if (item.score && item.score > 0) {
        totalScoresSum += item.score;
        scoredItemsCount++;
      }
      
      if (item.genres) {
        item.genres.split(',').forEach(g => {
          const name = g.trim();
          if (!name) return;
          genreCounts[name] = (genreCounts[name] || 0) + 1;
          if (genreCounts[name] > maxGenreCount) {
            maxGenreCount = genreCounts[name];
            favGenre = name;
          }
        });
      }
    });
    
    const totalHours = ((totalEpisodes * 24) / 60).toFixed(1);
    const meanScore = scoredItemsCount > 0 ? (totalScoresSum / scoredItemsCount).toFixed(1) : '0.0';
    
    // Render Stats
    document.getElementById('statTotalWatched').innerText = completedCount;
    document.getElementById('statHoursWatched').innerText = totalHours;
    document.getElementById('statMeanScore').innerText = meanScore;
    document.getElementById('statFavGenre').innerText = favGenre;
    
    // Render Distribution Bars
    const totalItems = watchlist.length || 1;
    const pWatching = (watchingCount / totalItems) * 100;
    const pCompleted = (completedCount / totalItems) * 100;
    const pPlan = (planCount / totalItems) * 100;
    
    document.getElementById('distWatchingBar').style.width = `${pWatching}%`;
    document.getElementById('distWatchingVal').innerText = `${watchingCount} ${watchingCount === 1 ? 'show' : 'shows'} (${Math.round(pWatching)}%)`;
    
    document.getElementById('distCompletedBar').style.width = `${pCompleted}%`;
    document.getElementById('distCompletedVal').innerText = `${completedCount} ${completedCount === 1 ? 'show' : 'shows'} (${Math.round(pCompleted)}%)`;
    
    document.getElementById('distPlanBar').style.width = `${pPlan}%`;
    document.getElementById('distPlanVal').innerText = `${planCount} ${planCount === 1 ? 'show' : 'shows'} (${Math.round(pPlan)}%)`;
    
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('profileContent').style.display = 'block';
  } catch (err) {
    console.error(err);
    document.getElementById('loadingState').innerHTML = `<p style="text-align:center; color: #ff5252;">Error loading profile data.</p>`;
  }
}
</script>
<!-- Modern Mobile Bottom Navigation Bar -->
<div class="mobile-nav-bar" aria-label="Mobile Navigation Bar">
  <a href="/" class="mobile-nav-item" id="mobileNavHome">
    <span class="nav-icon">🏠</span>
    <span>Home</span>
  </a>
  <a href="/schedule.html" class="mobile-nav-item" id="mobileNavSchedule">
    <span class="nav-icon">📅</span>
    <span>Schedule</span>
  </a>
  <button onclick="spinWheel()" class="mobile-nav-item" id="mobileNavRandom" aria-label="Random anime">
    <span class="nav-icon">🎲</span>
    <span>Random</span>
  </button>
  <a href="/watchlist.html" class="mobile-nav-item" id="mobileNavWatchlist">
    <span class="nav-icon">📚</span>
    <span>Watchlist</span>
  </a>
  <a href="/vibe-mixer.html" class="mobile-nav-item" id="mobileNavMixer">
    <span class="nav-icon">🧪</span>
    <span>Vibes</span>
  </a>
</div>
<script src="/script.js"></script>
</body>
</html>
