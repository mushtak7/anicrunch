<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <title>anicrunch · My Profile</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .profile-page { min-height: 100vh; background: #0f0f1a; }

    /* Hero Header */
    .profile-hero {
      position: relative;
      padding: 60px 40px;
      background: linear-gradient(135deg, rgba(120, 75, 160, 0.1) 0%, rgba(255, 60, 172, 0.1) 100%);
      border-bottom: 1px solid var(--border);
    }

    .profile-hero-content {
      position: relative;
      z-index: 1;
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .avatar-container {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--accent);
      background: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    .avatar-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-info {
      flex: 1;
    }

    .profile-info h1 {
      font-size: 36px;
      margin: 0 0 10px 0;
      color: white;
    }

    .profile-bio {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
      margin-bottom: 15px;
      max-width: 500px;
    }

    .stats-bar {
      display: flex;
      gap: 20px;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stat-icon { font-size: 20px; }
    .stat-info h3 { font-size: 20px; margin: 0; font-weight: 700; color: white;}
    .stat-info p { font-size: 12px; color: var(--muted); margin: 0; }

    /* Settings Form */
    .profile-settings {
      max-width: 800px;
      margin: 40px auto;
      padding: 30px;
      background: #1a1a2e;
      border: 1px solid var(--border);
      border-radius: 16px;
    }

    .profile-settings h2 {
      margin-top: 0;
      color: white;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      color: var(--muted);
      margin-bottom: 8px;
      font-size: 14px;
    }

    .form-group input, .form-group textarea {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: white;
      font-family: inherit;
    }
    
    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .btn-save {
      background: var(--gradient);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    
    .btn-save:hover { opacity: 0.9; }

    .loader {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 40px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

  </style>
</head>
<body class="profile-page">

<header>
  <h1 onclick="location.href='/'" style="cursor:pointer; margin: 0; font-size: 24px; font-weight: bold; color: white;">anicrunch</h1>
  <div style="flex:1"></div>
  <a href="/watchlist.html" class="nav-link" style="color: var(--muted); margin-right: 20px; text-decoration: none;">Watchlist</a>
  <div id="authArea"></div>
</header>

<div id="loadingState">
  <div class="loader"></div>
</div>

<div id="profileContent" style="display: none;">
  <section class="profile-hero">
    <div class="profile-hero-content">
      <div class="avatar-container" id="avatarDisplay">
        👤
      </div>
      <div class="profile-info">
        <h1 id="usernameDisplay">Username</h1>
        <p class="profile-bio" id="bioDisplay">No bio set.</p>
        <div class="stats-bar">
          <div class="stat-card">
            <div class="stat-icon">✅</div>
            <div class="stat-info"><h3 id="statTotalWatched">0</h3><p>Total Completed</p></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="profile-settings">
    <h2>Edit Profile</h2>
    <form id="profileForm">
      <div class="form-group">
        <label for="avatarUrl">Avatar Image URL (Optional)</label>
        <input type="url" id="avatarUrl" placeholder="https://example.com/avatar.jpg">
      </div>
      <div class="form-group">
        <label for="bio">Bio (Optional)</label>
        <textarea id="bio" placeholder="Tell us about your favorite anime..."></textarea>
      </div>
      <button type="submit" class="btn-save" id="saveBtn">Save Changes</button>
      <span id="saveStatus" style="margin-left: 15px; color: #00e676; display: none;">Saved!</span>
    </form>
  </section>
</div>

<script>
const API_BASE = location.hostname === "localhost" ? "" : "https://anicrunch-backend.onrender.com";

document.addEventListener("DOMContentLoaded", () => {
  const authArea = document.getElementById("authArea");

  fetch(`${API_BASE}/api/me`, { credentials: "include" })
    .then(r => r.json())
    .then(d => {
      if (d.user) {
        authArea.innerHTML = `<span style="color:var(--muted)">👤 ${d.user.username}</span> <button class="auth-link" style="background: none; border: none; color: var(--accent); cursor: pointer; margin-left: 10px;" onclick="logout()">Logout</button>`;
        loadProfile();
      } else {
        location.href = '/login.html';
      }
    })
    .catch(() => location.href = '/login.html');

  window.logout = () => fetch(`${API_BASE}/api/logout`, { 
    method: "POST", 
    credentials: "include" 
  }).then(() => location.href = '/');
  
  document.getElementById('profileForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('saveBtn');
    btn.innerText = 'Saving...';
    btn.disabled = true;
    
    const avatarUrl = document.getElementById('avatarUrl').value;
    const bio = document.getElementById('bio').value;
    
    try {
      const res = await fetch(`${API_BASE}/api/profile/update`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ avatarUrl, bio })
      });
      
      if (res.ok) {
        document.getElementById('saveStatus').style.display = 'inline';
        setTimeout(() => document.getElementById('saveStatus').style.display = 'none', 3000);
        
        // Update display
        if (avatarUrl) {
          document.getElementById('avatarDisplay').innerHTML = `<img src="${avatarUrl}" alt="Avatar">`;
        } else {
          document.getElementById('avatarDisplay').innerHTML = `👤`;
        }
        document.getElementById('bioDisplay').innerText = bio || 'No bio set.';
      }
    } catch (e) {
      console.error(e);
      alert('Error saving profile');
    } finally {
      btn.innerText = 'Save Changes';
      btn.disabled = false;
    }
  });
});

async function loadProfile() {
  try {
    const res = await fetch(`${API_BASE}/api/profile`, { credentials: "include" });
    if (!res.ok) throw new Error('Failed to load profile');
    
    const data = await res.json();
    
    document.getElementById('usernameDisplay').innerText = data.user.username;
    document.getElementById('bioDisplay').innerText = data.user.bio || 'No bio set.';
    
    if (data.user.avatar_url) {
      document.getElementById('avatarDisplay').innerHTML = `<img src="${data.user.avatar_url}" alt="Avatar">`;
      document.getElementById('avatarUrl').value = data.user.avatar_url;
    }
    
    if (data.user.bio) {
      document.getElementById('bio').value = data.user.bio;
    }
    
    document.getElementById('statTotalWatched').innerText = data.stats.totalWatched;
    
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('profileContent').style.display = 'block';
  } catch (err) {
    console.error(err);
    document.getElementById('loadingState').innerHTML = `<p style="text-align:center; color: #ff5252;">Error loading profile data.</p>`;
  }
}
</script>
</body>
</html>
