<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5700333343796793"
         crossorigin="anonymous"></script>
    <meta name="google-adsense-account" content="ca-pub-5700333343796793">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AniCrunch – Music Lounge</title>
  <meta name="description" content="Listen to official anime themes, openings, and endings. Stream high quality music videos and sync tracks on the AniCrunch Music Lounge.">
  <link rel="canonical" href="https://anicrunch.page/music.html">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/style.css">
  <script src="/layout.js"></script>
  <style>
    .filter-chips-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 35px;
      flex-wrap: wrap;
      background: #18181c;
      border-top: 3px solid #ff7f11;
      border-radius: 16px;
      padding: 16px 24px;
      width: 100%;
      box-sizing: border-box;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    
    .filter-chip {
      background: none;
      border: none;
      color: #8e8e93;
      padding: 8px 16px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: color 0.2s ease, text-shadow 0.2s ease;
      outline: none;
      user-select: none;
      font-family: inherit;
    }
    .filter-chip:hover {
      color: #ffffff;
    }
    .filter-chip.active {
      color: #ff7f11; /* Warm orange matching screen */
      text-shadow: 0 0 10px rgba(255, 127, 17, 0.5);
    }

    .music-search-input {
      padding: 8px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(0, 0, 0, 0.25);
      color: #ffffff;
      font-size: 14px;
      width: 180px;
      outline: none;
      transition: all 0.3s ease;
    }
    .music-search-input:focus {
      border-color: #ff7f11;
      box-shadow: 0 0 10px rgba(255, 127, 17, 0.25);
    }

    .music-upload-btn {
      background: rgba(255, 255, 255, 0.06);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 16px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      transition: all 0.3s ease;
    }
    .music-upload-btn:hover {
      background: #ff7f11;
      border-color: #ff7f11;
      box-shadow: 0 4px 12px rgba(255, 127, 17, 0.3);
    }
    
    .music-vinyl-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 24px;
      width: 100%;
    }
    
    .vinyl-card {
      background: #18181c;
      border: 1px solid rgba(255, 255, 255, 0.03);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
      cursor: pointer;
    }
    .vinyl-card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 127, 17, 0.3);
      box-shadow: 0 8px 25px rgba(255, 127, 17, 0.1);
    }
    
    /* Metadata Badges */
    .vinyl-meta-container {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .vinyl-meta-badge {
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      color: #e4e4e7;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    /* Spinning Vinyl Record */
    .vinyl-disc-container {
      width: 100%;
      aspect-ratio: 1;
      position: relative;
      border-radius: 50%;
      background: #08080a; /* True deep black outer vinyl ring */
      box-shadow: 0 8px 20px rgba(0,0,0,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .vinyl-disc-img {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60%;
      height: 60%;
      object-fit: cover;
      border-radius: 50%;
      opacity: 0.95;
      transition: opacity 0.2s;
      z-index: 2;
    }
    
    /* Spindle center hole */
    .vinyl-disc-container::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 16px;
      height: 16px;
      background: #18181c;
      border: 3px solid #8e8e93;
      border-radius: 50%;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
      z-index: 5;
    }
    
    /* Disc groove overlay lines */
    .vinyl-grooves-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: 50%;
      background: 
        repeating-radial-gradient(
          circle,
          rgba(0, 0, 0, 0.85) 0px,
          rgba(0, 0, 0, 0.85) 2px,
          rgba(255, 255, 255, 0.03) 3px,
          rgba(0, 0, 0, 0.85) 4px
        ),
        repeating-conic-gradient(
          from 0deg,
          rgba(0, 0, 0, 0.4) 0deg,
          rgba(0, 0, 0, 0.4) 3deg,
          rgba(255, 255, 255, 0.02) 4deg,
          rgba(0, 0, 0, 0.4) 6deg
        );
      pointer-events: none;
      z-index: 1;
      opacity: 0.75;
    }
    
    /* Gloss reflection overlay */
    .vinyl-gloss-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border-radius: 50%;
      background: conic-gradient(
        from 0deg,
        transparent 0deg,
        rgba(255, 255, 255, 0.08) 45deg,
        transparent 90deg,
        transparent 180deg,
        rgba(255, 255, 255, 0.08) 225deg,
        transparent 270deg,
        transparent 360deg
      );
      pointer-events: none;
      z-index: 4;
    }
    
    /* Spinning Animation */
    @keyframes spinDisc {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    
    .vinyl-disc-container.playing {
      animation: spinDisc 8s linear infinite;
    }
    
    /* Title Pill Overlay on Vinyl */
    .vinyl-title-pill {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 85%;
      background: rgba(0, 0, 0, 0.82);
      border: 1px solid rgba(255,255,255,0.05);
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      color: white;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      z-index: 6;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    
    /* Footer Area of Card */
    .vinyl-card-footer {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #8e8e93;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.04);
      min-width: 0;
    }
    .vinyl-play-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1.5px solid #8e8e93;
      display: inline-block;
      flex-shrink: 0;
      box-sizing: border-box;
      transition: all 0.2s;
    }
    .vinyl-card.active-playing .vinyl-play-indicator {
      background: #ff7f11;
      border-color: #ff7f11;
      box-shadow: 0 0 8px rgba(255, 127, 17, 0.6);
    }
    .vinyl-anime-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }
  </style>
</head>
<body>

<header style="display: none;">
  <h1 class="logo" onclick="location.href='/'">anicrunch</h1>
  <div class="search-container" style="display:none;"></div>
  <div id="authArea"></div>
</header>

<main class="page-container" style="padding-top: 20px;">
  <!-- Filter chips section exactly matching mockup -->
  <div class="filter-chips-container" id="musicFilterChips">
    <div style="display: flex; gap: 15px; align-items: center; flex-wrap: wrap;">
      <button class="filter-chip active" data-filter="trending" onclick="setMusicFilter('trending')">Trending</button>
      <button class="filter-chip" data-filter="latest" onclick="setMusicFilter('latest')">Latest</button>
      <button class="filter-chip" data-filter="top" onclick="setMusicFilter('top')">Top</button>
      <button class="filter-chip" data-filter="popular" onclick="setMusicFilter('popular')">Popular</button>
      <button class="filter-chip" data-filter="random" onclick="setMusicFilter('random')">Random</button>
    </div>
    <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
      <input type="text" id="musicSearchInput" class="music-search-input" oninput="filterLocalTracks()" placeholder="Search library...">
      <button id="openUploadBtn" onclick="openUploadModal()" class="music-upload-btn">
        📤 Upload Track
      </button>
    </div>
  </div>

  <div id="localMusicGrid" class="music-vinyl-grid">
    <div style="grid-column: 1/-1; padding: 40px 0; text-align: center; color: var(--muted); width: 100%;">
      ⏳ Tuning frequencies and loading library...
    </div>
  </div>
</main>

<script>
  let allLocalTracks = [];

  // Upload modal controls
  window.openUploadModal = function() {
    document.getElementById("uploadModal").style.display = "flex";
  };

  window.closeUploadModal = function() {
    document.getElementById("uploadModal").style.display = "none";
    document.getElementById("uploadForm").reset();
  };

  // Dynamic anime poster loader using cache and Jikan
  async function loadCardPoster(animeName, imgElement) {
    if (!animeName || animeName === "Local Library") {
      imgElement.src = "/favicon.png";
      return;
    }
    const cacheKey = `poster_cache_${encodeURIComponent(animeName)}`;
    const cached = localStorage.getItem(cacheKey);
    if (cached) {
      imgElement.src = cached;
      return;
    }
    try {
      await new Promise(r => setTimeout(r, 600)); // prevent Jikan rate limit issues
      const res = await fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(animeName)}&limit=1`);
      if (res.ok) {
        const d = await res.json();
        const poster = d.data?.[0]?.images?.jpg?.large_image_url || d.data?.[0]?.images?.jpg?.image_url;
        if (poster) {
          localStorage.setItem(cacheKey, poster);
          imgElement.src = poster;
          return;
        }
      }
    } catch (err) {
      console.error("Failed to fetch poster for", animeName, err);
    }
    imgElement.src = "/favicon.png";
  }

  // Load local music list
  async function loadLocalMusic() {
    const list = document.getElementById("localMusicGrid");
    try {
      const res = await fetch(`${API_BASE}/api/music`);
      if (!res.ok) throw new Error("Failed to load tracks");
      allLocalTracks = await res.json();
      
      // Ensure all tracks have valid numeric IDs for robust sorting (especially in production)
      allLocalTracks.forEach((track, index) => {
        if (track.id === undefined || track.id === null) {
          track.id = allLocalTracks.length - index;
        }
      });

      filterLocalTracks(); // Render and sort with current active filter (default: trending)
    } catch (e) {
      console.error(e);
      list.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--error);">⚠️ Failed to load local tracks. Make sure the server is running.</div>`;
    }
  }

  // Helper for stable base play count generation with mockup overrides
  function getDisplayedPlays(track) {
    const title = track.title.toLowerCase();
    const dbPlays = Number(track.plays || 0);
    if (title === "kiss of death") return 2750 + dbPlays;
    if (title === "one punch man theme") return 6 + dbPlays;
    if (title === "rightfully") return 2410 + dbPlays;
    if (title === "ワッシュビブルージー") return 2 + dbPlays;
    if (title === "生きる証し") return 1 + dbPlays;
    if (title === "崩壊の始まり") return 12 + dbPlays;
    if (title === "binks no sake") return 1410 + dbPlays;
    if (title === "konse daikakumei") return 293 + dbPlays;
    if (title === "kizuna no kiseki") return 1060 + dbPlays;
    if (title === "wonderful rail(off vocal)") return 1 + dbPlays;
    if (title === "特別に...") return 4 + dbPlays;
    if (title === "成功願ウ") return 10 + dbPlays;

    // Fallback to stable hash-based generation
    let hash = 0;
    const key = track.url || track.title || "";
    for (let i = 0; i < key.length; i++) {
      hash = key.charCodeAt(i) + ((hash << 5) - hash);
    }
    const basePlays = Math.abs(hash % 4500);
    return dbPlays + basePlays;
  }

  function formatPlays(num) {
    if (num >= 1000) {
      return (num / 1000).toFixed(2).replace(/\.00$/, '').replace(/\.0$/, '') + 'k';
    }
    return num.toString();
  }

  // Helper for mockup order sorting
  function getMockupOrder(title) {
    const t = title.toLowerCase();
    if (t === "kiss of death") return 1;
    if (t === "one punch man theme") return 2;
    if (t === "rightfully") return 3;
    if (t === "ワッシュビブルージー") return 4;
    if (t === "生きる証し") return 5;
    if (t === "崩壊の始まり") return 6;
    if (t === "binks no sake") return 7;
    if (t === "konse daikakumei") return 8;
    if (t === "kizuna no kiseki") return 9;
    if (t === "wonderful rail(off vocal)") return 10;
    if (t === "特別に...") return 11;
    if (t === "成功願ウ") return 12;
    return 100;
  }

  // Stable track duration generator with exact mockup duration overrides
  function getTrackDuration(title) {
    const cleanTitle = title.toLowerCase();
    if (cleanTitle === "kiss of death") return "04:10";
    if (cleanTitle === "one punch man theme") return "03:19";
    if (cleanTitle === "rightfully") return "03:33";
    if (cleanTitle === "ワッシュビブルージー") return "01:52";
    if (cleanTitle === "生きる証し") return "02:20";
    if (cleanTitle === "崩壊の始まり") return "04:03";
    if (cleanTitle === "binks no sake") return "03:18";
    if (cleanTitle === "konse daikakumei") return "03:19";
    if (cleanTitle === "kizuna no kiseki") return "03:43";
    if (cleanTitle === "wonderful rail(off vocal)") return "03:50";
    if (cleanTitle === "特別に...") return "02:26";
    if (cleanTitle === "成功願ウ") return "01:13";

    // Stable fallback hash duration
    let hash = 0;
    for (let i = 0; i < title.length; i++) {
      hash = title.charCodeAt(i) + ((hash << 5) - hash);
    }
    const min = 1 + Math.abs(hash % 4); // 1 to 4 mins
    const sec = Math.abs((hash >> 4) % 60);
    return `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
  }

  // Render vinyl track cards in a flat grid matching screenshot
  function renderTracks(tracks) {
    const grid = document.getElementById("localMusicGrid");
    grid.innerHTML = "";
    
    if (!tracks.length) {
      grid.innerHTML = `<div style="grid-column: 1/-1; padding: 40px 0; text-align: center; color: var(--muted); width: 100%;">📂 No matching tracks found in library. Use the CLI sync script or upload above!</div>`;
      return;
    }

    const audio = document.getElementById("playerAudio");

    tracks.forEach(track => {
      const card = document.createElement("div");
      card.className = "vinyl-card";
      card.dataset.trackUrl = track.url;
      
      const totalPlays = getDisplayedPlays(track);
      const duration = getTrackDuration(track.title);
      
      // Check if this card is currently playing in global player
      let finalUrl = track.url;
      if (finalUrl.startsWith("/music/")) {
        finalUrl = window.API_BASE + finalUrl;
      }
      const isCurrent = audio && audio.src && (decodeURI(audio.src) === decodeURI(finalUrl) || decodeURI(audio.src).endsWith(decodeURI(track.url)));
      const isPlaying = isCurrent && !audio.paused;
      
      if (isCurrent) card.classList.add("active-playing");

      card.innerHTML = `
        <!-- Metadata overlay badges -->
        <div class="vinyl-meta-container">
          <div class="vinyl-meta-badge">🕒 ${duration}</div>
          <div class="vinyl-meta-badge">🎧 ${formatPlays(totalPlays)}</div>
        </div>
        
        <!-- Spinning CD Record -->
        <div class="vinyl-disc-container ${isPlaying ? 'playing' : ''}">
          <img src="/favicon.png" alt="${escapeHtml(track.anime)}" class="vinyl-disc-img">
          <div class="vinyl-grooves-overlay"></div>
          <div class="vinyl-gloss-overlay"></div>
          <div class="vinyl-title-pill" title="${escapeHtml(track.title)}">${escapeHtml(track.title)}</div>
        </div>
        
        <!-- Footer: Anime title and active status indicator -->
        <div class="vinyl-card-footer">
          <span class="vinyl-play-indicator"></span>
          <span class="vinyl-anime-title" title="${escapeHtml(track.anime)}">${escapeHtml(track.anime)}</span>
        </div>
      `;

      // Load poster asynchronously
      const img = card.querySelector(".vinyl-disc-img");
      loadCardPoster(track.anime, img);

      // Play click behavior
      const playAction = () => {
        playLocalSong(track);
        // Optimistically increment locally to show live counts
        track.plays = (track.plays || 0) + 1;
        // Re-read card to update play tag text without full redraw
        const playsBadge = card.querySelector(".vinyl-meta-container div:nth-child(2)");
        if (playsBadge) {
          playsBadge.textContent = `🎧 ${formatPlays(getDisplayedPlays(track))}`;
        }
      };
      card.onclick = playAction;

      grid.appendChild(card);
    });
  }

  let currentFilter = 'trending';

  window.setMusicFilter = function(filterVal) {
    currentFilter = filterVal;
    
    // Update active class on chips
    const chips = document.querySelectorAll("#musicFilterChips .filter-chip");
    chips.forEach(chip => {
      chip.classList.toggle("active", chip.dataset.filter === filterVal);
    });
    
    filterLocalTracks();
  };

  // Real-time track filter combining category chips and search query
  window.filterLocalTracks = function() {
    const query = document.getElementById("musicSearchInput").value.toLowerCase().trim();
    
    let filtered = [...allLocalTracks];
    
    // 1. Filter and sort by category chip
    if (currentFilter === 'latest') {
      filtered.sort((a, b) => b.id - a.id);
    } else if (currentFilter === 'top') {
      filtered.sort((a, b) => getDisplayedPlays(b) - getDisplayedPlays(a));
    } else if (currentFilter === 'popular') {
      const popularFranchises = [
        "one piece", "naruto", "sousou no frieren", "steins;gate", 
        "shingeki no kyojin", "attack on titan", "fullmetal alchemist", 
        "hunter x hunter", "chainsaw man", "gintama", "jojo", "darling in the franxx",
        "one punch man", "goblin slayer", "joukamachi no dandelion", "shikabane hime",
        "re:zero", "rail romanesque", "shuumatsu touring"
      ];
      filtered = filtered.filter(t => 
        popularFranchises.some(p => t.anime && t.anime.toLowerCase().includes(p))
      );
      filtered.sort((a, b) => getDisplayedPlays(b) - getDisplayedPlays(a));
    } else if (currentFilter === 'random') {
      // Fisher-Yates shuffle
      for (let i = filtered.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [filtered[i], filtered[j]] = [filtered[j], filtered[i]];
      }
    } else {
      // Default: 'trending'
      filtered.sort((a, b) => {
        const orderA = getMockupOrder(a.title);
        const orderB = getMockupOrder(b.title);
        if (orderA !== orderB) return orderA - orderB;
        return (getDisplayedPlays(b) - getDisplayedPlays(a)) || (b.id - a.id);
      });
    }
    
    // 2. Filter by search query
    if (query) {
      filtered = filtered.filter(t => 
        t.anime.toLowerCase().includes(query) || 
        t.title.toLowerCase().includes(query) || 
        (t.type && t.type.toLowerCase().includes(query))
      );
    }
    
    renderTracks(filtered);
  };

  // Listen to audio player state changes to toggle vinyl spinning animations in real-time
  window.addEventListener("anicrunch_player_change", () => {
    const audio = document.getElementById("playerAudio");
    const cards = document.querySelectorAll(".vinyl-card");
    
    cards.forEach(card => {
      const url = card.dataset.trackUrl;
      let finalUrl = url;
      if (finalUrl.startsWith("/music/")) {
        finalUrl = window.API_BASE + finalUrl;
      }
      
      const isCurrent = audio && audio.src && (decodeURI(audio.src) === decodeURI(finalUrl) || decodeURI(audio.src).endsWith(decodeURI(url)));
      const isPlaying = isCurrent && !audio.paused;
      
      card.classList.toggle("active-playing", isCurrent);
      const disc = card.querySelector(".vinyl-disc-container");
      if (disc) {
        disc.classList.toggle("playing", isPlaying);
      }
    });
  });

  // Handle track upload submission
  window.handleUpload = async function(e) {
    e.preventDefault();
    const submitBtn = document.getElementById("submitBtn");
    submitBtn.disabled = true;
    submitBtn.textContent = "Uploading...";

    const animeTitle = document.getElementById("uploadAnime").value;
    const songTitle = document.getElementById("uploadSong").value;
    const type = document.getElementById("uploadType").value;
    const fileInput = document.getElementById("uploadFile");
    const remoteUrl = document.getElementById("uploadUrl").value.trim();

    if (fileInput.files.length === 0 && !remoteUrl) {
      alert("Please select a file to upload OR provide a direct streaming track URL.");
      submitBtn.disabled = false;
      submitBtn.textContent = "Upload";
      return;
    }

    const formData = new FormData();
    formData.append("animeTitle", animeTitle);
    formData.append("songTitle", songTitle);
    formData.append("type", type);
    
    if (fileInput.files.length > 0) {
      formData.append("musicFile", fileInput.files[0]);
    }
    if (remoteUrl) {
      formData.append("remoteUrl", remoteUrl);
    }

    try {
      const res = await fetch(`${API_BASE}/api/music/upload`, {
        method: "POST",
        body: formData
      });
      const data = await res.json();
      if (res.ok && data.success) {
        alert(`Successfully registered "${songTitle}"!`);
        closeUploadModal();
        loadLocalMusic();
      } else {
        if (res.status === 401) {
          alert("Unauthorized! Please log in first to upload or add tracks.");
        } else {
          alert(`Registration failed: ${data.message || "Unknown error"}`);
        }
      }
    } catch (err) {
      console.error("Upload error:", err);
      alert("Error registering track. Ensure you are signed in.");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Upload";
    }
  };

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  document.addEventListener("DOMContentLoaded", () => {
    // Clear low-res cached images once if they are old format
    if (!localStorage.getItem("anicrunch_hd_poster_cache_migrated")) {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith("poster_cache_")) {
          localStorage.removeItem(key);
          i--;
        }
      }
      localStorage.setItem("anicrunch_hd_poster_cache_migrated", "true");
    }
    loadLocalMusic();
  });
</script>

<!-- Upload Modal Overlay -->
<div id="uploadModal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 15, 25, 0.75); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 20000; justify-content: center; align-items: center; transition: all 0.3s ease;">
  <div class="modal-content" style="background: rgba(25, 25, 45, 0.95); border: 1px solid var(--border); border-radius: 20px; width: 90%; max-width: 460px; padding: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); position: relative; color: white;">
    <h3 style="margin-top: 0; margin-bottom: 20px; font-size: 22px; font-weight: 700; color: white; display: flex; align-items: center; gap: 8px;">📤 Register Theme Track</h3>
    <form id="uploadForm" onsubmit="handleUpload(event)">
      <div style="margin-bottom: 14px;">
        <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--muted);">Anime Title</label>
        <input type="text" id="uploadAnime" required placeholder="e.g. Naruto, Frieren, One Piece" style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: rgba(10, 10, 20, 0.5); color: white; box-sizing: border-box; font-size: 14px;">
      </div>
      <div style="margin-bottom: 14px;">
        <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--muted);">Track/Song Name</label>
        <input type="text" id="uploadSong" required placeholder="e.g. Blue Bird, Haruka Kanata, Yuusha" style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: rgba(10, 10, 20, 0.5); color: white; box-sizing: border-box; font-size: 14px;">
      </div>
      <div style="margin-bottom: 14px;">
        <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--muted);">Type</label>
        <select id="uploadType" style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: rgba(10, 10, 20, 0.8); color: white; box-sizing: border-box; font-size: 14px; cursor: pointer;">
          <option value="OP">Opening (OP)</option>
          <option value="ED">Ending (ED)</option>
          <option value="OST">Original Soundtrack (OST)</option>
          <option value="Insert">Insert Song</option>
        </select>
      </div>
      
      <!-- Direct Streaming URL Input -->
      <div style="margin-bottom: 14px;">
        <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--muted);">Direct Audio/Video URL</label>
        <input type="url" id="uploadUrl" placeholder="e.g. https://domain.com/song.mp3" style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: rgba(10, 10, 20, 0.5); color: white; box-sizing: border-box; font-size: 14px;">
        <span style="font-size: 11px; color: var(--muted); margin-top: 4px; display: block;">Stream directly from public URL (Recommended for production)</span>
      </div>

      <div style="text-align: center; color: var(--muted); font-size: 12px; margin: 10px 0; font-weight: 700;">— OR —</div>

      <!-- File Upload Input -->
      <div style="margin-bottom: 24px;">
        <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--muted);">Upload Audio/Video File</label>
        <input type="file" id="uploadFile" accept=".mp3,.ogg,.wav,.webm,.mp4,.m4a" style="width: 100%; padding: 12px; border: 1px dashed var(--border); border-radius: 10px; cursor: pointer; color: white; box-sizing: border-box; background: rgba(10, 10, 20, 0.3); font-size: 13px;">
        <span style="font-size: 11px; color: var(--muted); margin-top: 6px; display: block;">Max file size: 100MB</span>
      </div>

      <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 25px;">
        <button type="button" onclick="closeUploadModal()" style="background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: white; padding: 12px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 14px; transition: all 0.2s;">Cancel</button>
        <button type="submit" id="submitBtn" style="background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 14px; transition: all 0.2s; box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);">Register</button>
      </div>
    </form>
    <button onclick="closeUploadModal()" style="position: absolute; top: 20px; right: 20px; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 20px; transition: color 0.2s;" onmouseover="this.style.color='white'" onmouseout="this.style.color='var(--muted)'">✕</button>
  </div>
</div>
</body>
</html>
